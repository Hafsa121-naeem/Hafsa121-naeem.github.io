<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <defs>
    <linearGradient id="windowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>

  <!-- Browser Window Wrapper -->
  <g filter="url(#shadow)">
    <!-- Window Frame -->
    <rect x="20" y="20" width="1160" height="740" rx="16" fill="url(#windowBg)" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Browser Titlebar -->
    <path d="M 20 36 A 16 16 0 0 1 36 20 L 1164 20 A 16 16 0 0 1 1180 36 L 1180 64 L 20 64 Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Window Controls (Red, Yellow, Green) -->
    <circle cx="48" cy="42" r="6" fill="#EF4444" />
    <circle cx="68" cy="42" r="6" fill="#F59E0B" />
    <circle cx="88" cy="42" r="6" fill="#10B981" />

    <!-- Browser URL Bar -->
    <rect x="180" y="30" width="800" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="580" y="46" font-size="11" fill="#64748B" font-family="'Poppins', sans-serif" text-anchor="middle" font-weight="500">
      🔒 https://usb-custom-showcase.hafsa.dev/catalog
    </text>

    <!-- Website Header Navigation Inside Browser -->
    <rect x="21" y="65" width="1158" height="60" fill="#FFFFFF" border-bottom="1px solid #E2E8F0" />
    <line x1="21" y1="125" x2="1179" y2="125" stroke="#E2E8F0" stroke-width="1" />

    <!-- Logo -->
    <rect x="60" y="80" width="30" height="30" rx="6" fill="url(#accentBlue)" />
    <text x="75" y="100" font-size="16" fill="#FFFFFF" font-family="'Poppins', sans-serif" text-anchor="middle" font-weight="800">⚡</text>
    <text x="102" y="101" font-size="18" fill="#0F172A" font-family="'Poppins', sans-serif" font-weight="800" letter-spacing="-0.5">FLASH<tspan fill="#2563EB">OEM</tspan></text>

    <!-- Nav Items -->
    <text x="740" y="100" font-size="13" fill="#0F172A" font-family="'Poppins', sans-serif" font-weight="600">Products</text>
    <text x="825" y="100" font-size="13" fill="#64748B" font-family="'Poppins', sans-serif" font-weight="500">Configurator</text>
    <text x="930" y="100" font-size="13" fill="#64748B" font-family="'Poppins', sans-serif" font-weight="500">Facility</text>
    <rect x="1020" y="80" width="110" height="30" rx="15" fill="#2563EB" />
    <text x="1075" y="100" font-size="12" fill="#FFFFFF" font-family="'Poppins', sans-serif" text-anchor="middle" font-weight="600">Get Quote</text>

    <!-- Website Hero Banner Inside Browser -->
    <rect x="45" y="145" width="1110" height="190" rx="14" fill="url(#heroGrad)" />
    
    <!-- Hero Decorative Grid / Glow -->
    <circle cx="980" cy="240" r="140" fill="#2563EB" opacity="0.25" />
    <circle cx="200" cy="240" r="100" fill="#4F46E5" opacity="0.2" />

    <rect x="75" y="170" width="160" height="22" rx="11" fill="rgba(37,99,235,0.3)" stroke="rgba(96,165,250,0.5)" stroke-width="1" />
    <text x="155" y="185" font-size="10" fill="#93C5FD" font-family="'Poppins', sans-serif" text-anchor="middle" font-weight="700" letter-spacing="1">TIER-1 OEM HARDWARE</text>

    <text x="75" y="225" font-size="28" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="800">
      Custom USB Flash Drives &amp; Laser Branding
    </text>
    <text x="75" y="255" font-size="14" fill="#94A3B8" font-family="'Poppins', sans-serif" font-weight="400">
      Engineered for corporate gifting, enterprise bulk procurement, and high-speed data transfer.
    </text>

    <!-- Hero CTA Buttons -->
    <rect x="75" y="275" width="130" height="36" rx="18" fill="#2563EB" />
    <text x="140" y="298" font-size="12" fill="#FFFFFF" font-family="'Poppins', sans-serif" text-anchor="middle" font-weight="700">Explore Catalog</text>

    <rect x="220" y="275" width="140" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <text x="290" y="298" font-size="12" fill="#FFFFFF" font-family="'Poppins', sans-serif" text-anchor="middle" font-weight="600">Laser Configurator</text>

    <!-- Product Showcase Section Header Inside Browser -->
    <text x="45" y="375" font-size="18" fill="#0F172A" font-family="'Poppins', sans-serif" font-weight="800">
      Featured Product Form Factors
    </text>
    <text x="45" y="395" font-size="12" fill="#64748B" font-family="'Poppins', sans-serif" font-weight="500">
      Interactive selection with real-time capacity and laser engraving preview
    </text>

    <!-- Product 1: Orbit Swivel Metal -->
    <g transform="translate(45, 415)">
      <rect width="260" height="310" rx="12" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="15" y="15" width="230" height="150" rx="8" fill="#FFFFFF" />
      <!-- Stylized USB Swivel illustration -->
      <rect x="75" y="75" width="70" height="30" rx="4" fill="#475569" />
      <rect x="110" y="70" width="75" height="40" rx="6" fill="#94A3B8" stroke="#64748B" stroke-width="2" />
      <circle cx="165" cy="90" r="6" fill="#CBD5E1" />
      <rect x="60" y="80" width="15" height="20" rx="1" fill="#E2E8F0" />
      <text x="15" y="195" font-size="15" fill="#0F172A" font-family="'Poppins', sans-serif" font-weight="700">Orbit Swivel Metal</text>
      <text x="15" y="215" font-size="11" fill="#64748B" font-family="'Poppins', sans-serif">360° Rotating Aluminum Shield</text>
      <text x="15" y="245" font-size="11" fill="#2563EB" font-family="'Poppins', sans-serif" font-weight="700">16GB • 32GB • 64GB • 128GB</text>
      <rect x="15" y="260" width="230" height="34" rx="17" fill="#2563EB" />
      <text x="130" y="282" font-size="12" fill="#FFFFFF" font-family="'Poppins', sans-serif" text-anchor="middle" font-weight="600">Configure &amp; Engrave</text>
    </g>

    <!-- Product 2: EcoBamboo Wood -->
    <g transform="translate(328, 415)">
      <rect width="260" height="310" rx="12" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="15" y="15" width="230" height="150" rx="8" fill="#FFFFFF" />
      <!-- Stylized Wooden USB -->
      <rect x="70" y="75" width="110" height="30" rx="4" fill="#D97706" />
      <line x1="75" y1="85" x2="175" y2="85" stroke="#B45309" stroke-width="1" />
      <line x1="80" y1="95" x2="170" y2="95" stroke="#B45309" stroke-width="1" />
      <rect x="175" y="80" width="15" height="20" rx="1" fill="#CBD5E1" />
      <text x="15" y="195" font-size="15" fill="#0F172A" font-family="'Poppins', sans-serif" font-weight="700">EcoBamboo Natural</text>
      <text x="15" y="215" font-size="11" fill="#64748B" font-family="'Poppins', sans-serif">Sustainable FSC Hardwood</text>
      <text x="15" y="245" font-size="11" fill="#2563EB" font-family="'Poppins', sans-serif" font-weight="700">16GB • 32GB • 64GB</text>
      <rect x="15" y="260" width="230" height="34" rx="17" fill="#0F172A" />
      <text x="130" y="282" font-size="12" fill="#FFFFFF" font-family="'Poppins', sans-serif" text-anchor="middle" font-weight="600">Configure &amp; Engrave</text>
    </g>

    <!-- Product 3: CardSlim Executive -->
    <g transform="translate(611, 415)">
      <rect width="260" height="310" rx="12" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="15" y="15" width="230" height="150" rx="8" fill="#FFFFFF" />
      <!-- Stylized Card USB -->
      <rect x="70" y="55" width="120" height="70" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
      <rect x="140" y="75" width="40" height="30" rx="3" fill="#2563EB" />
      <text x="80" y="75" font-size="8" fill="#64748B" font-family="'Poppins', sans-serif" font-weight="700">FULL-COLOR PRINT</text>
      <text x="15" y="195" font-size="15" fill="#0F172A" font-family="'Poppins', sans-serif" font-weight="700">CardSlim Credit Card</text>
      <text x="15" y="215" font-size="11" fill="#64748B" font-family="'Poppins', sans-serif">Ultra-Thin Wallet Form Factor</text>
      <text x="15" y="245" font-size="11" fill="#2563EB" font-family="'Poppins', sans-serif" font-weight="700">32GB • 64GB • 128GB</text>
      <rect x="15" y="260" width="230" height="34" rx="17" fill="#0F172A" />
      <text x="130" y="282" font-size="12" fill="#FFFFFF" font-family="'Poppins', sans-serif" text-anchor="middle" font-weight="600">Configure &amp; Engrave</text>
    </g>

    <!-- Product 4: DuoLink Pro Type-C -->
    <g transform="translate(894, 415)">
      <rect width="260" height="310" rx="12" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="15" y="15" width="230" height="150" rx="8" fill="#FFFFFF" />
      <!-- Stylized Dual USB -->
      <rect x="70" y="75" width="105" height="30" rx="4" fill="#1E293B" />
      <rect x="58" y="81" width="12" height="18" rx="2" fill="#94A3B8" />
      <rect x="175" y="80" width="15" height="20" rx="1" fill="#CBD5E1" />
      <text x="15" y="195" font-size="15" fill="#0F172A" font-family="'Poppins', sans-serif" font-weight="700">DuoLink Dual-Port</text>
      <text x="15" y="215" font-size="11" fill="#64748B" font-family="'Poppins', sans-serif">USB-C + USB-A 3.2 Gen 1</text>
      <text x="15" y="245" font-size="11" fill="#2563EB" font-family="'Poppins', sans-serif" font-weight="700">64GB • 128GB • 256GB</text>
      <rect x="15" y="260" width="230" height="34" rx="17" fill="#0F172A" />
      <text x="130" y="282" font-size="12" fill="#FFFFFF" font-family="'Poppins', sans-serif" text-anchor="middle" font-weight="600">Configure &amp; Engrave</text>
    </g>
  </g>
</svg>