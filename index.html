    // --- INTERACTIVE BACKGROUND CANVAS ---
    function InteractiveAiBackground({ darkMode }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const mouse = { x: width / 2, y: height / 2, targetX: width / 2, targetY: height / 2 };
        const handleMouseMove = (e) => {
          mouse.targetX = e.clientX;
          mouse.targetY = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const pointCount = Math.floor(Math.min(width, height) / 22);
        const points = [];
        for (let i = 0; i < pointCount; i++) {
          points.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.45,
            vy: (Math.random() - 0.5) * 0.45,
            radius: Math.random() * 2 + 1.2,
          });
        }

        const render = () => {
          mouse.x += (mouse.targetX - mouse.x) * 0.04;
          mouse.y += (mouse.targetY - mouse.y) * 0.04;

          ctx.clearRect(0, 0, width, height);

          // Grid pattern
          ctx.strokeStyle = darkMode ? 'rgba(255, 255, 255, 0.02)' : 'rgba(15, 23, 42, 0.025)';
          ctx.lineWidth = 1;
          const gridSize = 45;
          for (let x = 0; x < width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
          }
          for (let y = 0; y < height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }

          // Ambient cursor radial spotlight
          const grad = ctx.createRadialGradient(mouse.x, mouse.y, 10, mouse.x, mouse.y, 380);
          if (darkMode) {
            grad.addColorStop(0, 'rgba(13, 148, 136, 0.12)');
            grad.addColorStop(0.5, 'rgba(37, 99, 235, 0.05)');
            grad.addColorStop(1, 'transparent');
          } else {
            grad.addColorStop(0, 'rgba(13, 148, 136, 0.07)');
            grad.addColorStop(0.5, 'rgba(37, 99, 235, 0.03)');
            grad.addColorStop(1, 'transparent');
          }
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);

          // Nodes & Connections
          for (let i = 0; i < points.length; i++) {
            const p = points[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = darkMode ? 'rgba(45, 212, 191, 0.45)' : 'rgba(13, 148, 136, 0.35)';
            ctx.fill();

            for (let j = i + 1; j < points.length; j++) {
              const p2 = points[j];
              const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist < 110) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = darkMode
                  ? 'rgba(45, 212, 191, ' + (0.15 * (1 - dist / 110)) + ')'
                  : 'rgba(13, 148, 136, ' + (0.12 * (1 - dist / 110)) + ')';
                ctx.stroke();
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
        };
      }, [darkMode]);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0"
          style={{ opacity: 0.85 }}
        />
      );
    }

    // --- CUSTOM CURSOR ---
    function CustomCursor() {
      const cursorRef = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const cursor = cursorRef.current;
        if (!cursor) return;

        const updatePosition = (clientX, clientY) => {
          if (!visible) setVisible(true);
          cursor.style.transform = 'translate3d(' + (clientX - 12) + 'px, ' + (clientY - 12) + 'px, 0)';
        };

        const onMouseMove = (e) => {
          updatePosition(e.clientX, e.clientY);
        };

        const onTouchMove = (e) => {
          if (e.touches && e.touches[0]) {
            updatePosition(e.touches[0].clientX, e.touches[0].clientY);
          }
        };

        window.addEventListener('mousemove', onMouseMove, { passive: true });
        window.addEventListener('touchmove', onTouchMove, { passive: true });
        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('touchmove', onTouchMove);
        };
      }, [visible]);

      return (
        <div
          ref={cursorRef}
          style={{ opacity: visible ? 1 : 0 }}
          className="fixed top-0 left-0 w-6 h-6 rounded-full border-2 border-teal-500/70 pointer-events-none z-50 transition-opacity duration-300 ease-out hidden md:block"
        >

        </div>
      );
    }

                className="px-5 py-2.5 rounded-xl text-xs font-mono font-bold bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 hover:bg-slate-200 transition-colors"
              >
                GitHub Repository ↗
              </a>
              <button
                onClick={onClose}
                className="px-6 py-2.5 rounded-xl text-xs font-mono font-bold bg-teal-600 hover:bg-teal-700 text-white shadow-2xs transition-all"
              >
                Close Details
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- APP CONTAINER ---
    function App() {
      const [resumeModalOpen, setResumeModalOpen] = useState(false);
      const [projectModalOpen, setProjectModalOpen] = useState(false);
      const [darkMode, setDarkMode] = useState(false);

      useEffect(() => {
        document.title = "Hafsa Naeem | Personal Portfolio";
      }, []);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      return (
        <div className={'min-h-screen transition-colors duration-500 selection:bg-teal-600 selection:text-white relative ' + (darkMode ? 'bg-[#030712] text-slate-100' : 'bg-[#F8FAFC] text-slate-900')}>
          <InteractiveAiBackground darkMode={darkMode} />
          <CustomCursor />
          <PortfolioNavbar
            onOpenResume={() => setResumeModalOpen(true)}
            darkMode={darkMode}
            setDarkMode={setDarkMode}
          />
          <main className="relative z-10">
            <WhozaryabLightHero onOpenResume={() => setResumeModalOpen(true)} darkMode={darkMode} />
            <AboutMeSection onOpenResume={() => setResumeModalOpen(true)} darkMode={darkMode} />
            <WhatIDoSection />
            <CareerSection darkMode={darkMode} />
            <WorkSection onOpenProjectModal={() => setProjectModalOpen(true)} />
            <ContactSection onOpenResume={() => setResumeModalOpen(true)} />
          </main>
          <ResumeModal
            isOpen={resumeModalOpen}
            onClose={() => setResumeModalOpen(false)}
          />
          <ProjectModal
            isOpen={projectModalOpen}
            onClose={() => setProjectModalOpen(false)}
          />
        </div>
      );
    }

    // Render the React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
